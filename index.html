<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WDD231 Course Dashboard</title>

  <meta name="description" content="Interactive WDD231 course dashboard showing course progress, credits earned, and completion status for Web and Software Development students.">
  <meta name="author" content="Michael Tafunai">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="styles/small.css">
  <link rel="stylesheet" href="styles/large.css">


  <script src="scripts/script.js" defer></script>
</head>

<body>

<header class="header">
  <div class="logo">WDD231 Dashboard</div>

  <button class="menu-btn" id="menuBtn" aria-label="Toggle navigation">☰</button>

  <nav id="nav" class="nav">
    <a href="#" class="active">Home</a>
    <a href="#">Courses</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</header>

<main>

  <section class="hero">
    <h1>Course Dashboard</h1>
    <h2>Overview</h2>
    <p>Track your progress, credits, and completed courses</p>
  </section>

  <section class="controls">
    <h2>Filters</h2>

    <div class="filters">
      <button data-filter="all">All</button>
      <button data-filter="completed">Completed</button>
      <button data-filter="incomplete">Incomplete</button>
    </div>

    <div class="summary">
      <h3>Total Credits</h3>
      <div id="credits" class="credits">0</div>
    </div>
  </section>

  <section>
    <h2>Courses</h2>
    <div id="courseContainer" class="grid"></div>
  </section>

</main>

<footer class="footer">
  <p>© <span id="year"></span> Michael Tafunai | Fiji</p>
  <p id="modified"></p>
</footer>

</body>
</html>
