<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suva Chamber Home</title>

    <meta name="description" content="Welcome to the Suva Chamber of Commerce">
    <meta name="author" content="Michael Tafunai">

    <meta property="og:title" content="Suva Chamber Home">
    <meta property="og:description" content="Discover businesses and opportunities in Suva, Fiji">
    <meta property="og:image" content="images/logo.jpg">
    <meta property="og:url" content="https://mtafunai.github.io/wdd231/chamber/index.html">

    <link rel="icon" href="images/logo.jpg">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/weather.js" defer></script>
    <script src="scripts/spotlight.js" defer></script>
</head>

<body>

<header>
    <div class="logo">
        <img src="images/logo.jpg" alt="Suva Chamber Logo" width="60">
        <span>Suva Chamber</span>
    </div>

    <button id="menuBtn">&#9776;</button>

    <nav id="navMenu">
        <a href="index.html" class="active">Home</a>
        <a href="directory.html">Directory</a>
        <a href="#">Join</a>
        <a href="#">Discover</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main>

    <section class="hero">
        <img src="images/hero.webp" alt="Suva City Hero Image">
        <div class="hero-text">
            <h1>Suva Chamber of Commerce</h1>
            <a href="#" class="cta-button">Join the Chamber</a>
        </div>
    </section>

    <section class="home-grid">

        <section class="events">
            <h2>Current Events</h2>
            <p>Business Networking Expo - June 2026</p>
            <p>Local Tourism Conference - July 2026</p>
        </section>

        <section class="weather">
            <h2>Weather</h2>

            <p><strong>Temperature:</strong>
                <span id="current-temp"></span>
            </p>

            <p id="weather-desc"></p>

            <div id="forecast"></div>
        </section>

        <section class="spotlights">
            <h2>Member Spotlights</h2>
            <div id="spotlight-container"></div>
        </section>

    </section>

</main>

<footer>
    <p>&copy; 2026 Suva Chamber of Commerce</p>
